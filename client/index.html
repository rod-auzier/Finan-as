<!doctype html>
<!--
  HTML base servido pelo Vite. O bundle React é injetado a partir de
  /src/main.jsx e montado na div #root.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Cor da barra do navegador / tema escuro. -->
    <meta name="theme-color" content="#14181C" />
    <meta name="color-scheme" content="dark" />
    <title>Painel Financeiro Pessoal</title>

    <!--
      Fontes (Google Fonts):
      - Inter        → textos e labels da interface (font-sans no Tailwind)
      - JetBrains Mono → valores monetários e números (font-mono + tabular-nums)
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
